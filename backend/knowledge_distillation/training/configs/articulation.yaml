# =============================================================================
# Articulation Coach — Student Training Configuration
#
# Student model: Llama-3.2-3B-Instruct, LoRA fine-tuned on the Articulation
# rubrics (Pronunciation, MTI) via backend.knowledge_distillation.training.
#
# Migrated off google/gemma-3-4b-it (see git history) specifically to drop
# the multimodal-checkpoint text-tower-narrowing workaround that model
# needed in trainer/model_loader.py: Llama-3.2-3B-Instruct is a plain,
# text-only causal-LM checkpoint (confirmed: AutoConfig(...).get_text_config()
# returns the config itself, same as Qwen2.5/delivery), so it loads via the
# same unmodified AutoModelForCausalLM path both students now share.
#
# This file is config data only -- no trainer reads it yet (see this
# package's parent docstring). See README.md in this directory for a full
# explanation of every field below.
# =============================================================================

model:
  # Meta's Llama 3.2 line ships an exact 3B instruction-tuned checkpoint --
  # no size substitution needed here (unlike Gemma's 4B-as-nearest-3B).
  model_name: "meta-llama/Llama-3.2-3B-Instruct"
  tokenizer_name: null      # null = derive from model_name at load time
  trust_remote_code: false  # Llama 3.2 is natively supported in recent transformers
  torch_dtype: "bfloat16"   # Llama 3.2 is trained/released in bf16; halves memory vs fp32

  # Ollama tag for the SAME model, used only as a local-presence check/pull
  # convenience (see trainer/model_loader.py's docstring for why this is a
  # separate field from model_name -- Ollama's GGUF blobs are not what
  # actually gets loaded for training). Set to null to skip the check
  # entirely. Confirm the exact tag with `ollama list` / the Ollama
  # library page before relying on it -- not independently verified here.
  ollama_model_name: "llama3.2:3b"

quantization:
  # 4-bit (QLoRA-style) loading via bitsandbytes. Requires a CUDA GPU --
  # silently ignored (falls back to unquantized, with a warning) on CPU/MPS,
  # since bitsandbytes doesn't support them, so this stays harmless on this
  # project's Apple Silicon dev machine.
  #
  # Kept enabled per this migration's own requirement (consistency with
  # delivery/Qwen2.5, and a comparable weight-precision baseline across both
  # students) rather than re-litigated from scratch. It's also a smaller ask
  # on this model than it was on Gemma: Llama-3.2's 128,256-token vocabulary
  # is exactly half Gemma-3's 262,208, so the loss's logits.float() term
  # (batch * seq * vocab * bytes) that drove the original Gemma OOM is
  # roughly half the size here at the same sequence length -- see
  # max_sequence_length below for this model's actual measured lengths.
  enabled: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

dataset:
  # train/validation/test.jsonl come from training/data/student_dataset.py
  # -- one already-split, already-validated file per coach, each record
  # {"input": {"level1", "level2"}, "target": {evaluation_analysis,
  # scores, score_reasoning, coach_output, reasoning_trace}}. `coach` is
  # a sanity check (the trainer asserts every record's own "coach" field
  # matches this value), not a filter -- the file itself is already
  # single-coach.
  coach: "articulation"
  train_file: "backend/knowledge_distillation/training/data/datasets/student_dataset/articulation/train.jsonl"
  validation_file: "backend/knowledge_distillation/training/data/datasets/student_dataset/articulation/validation.jsonl"
  test_file: "backend/knowledge_distillation/training/data/datasets/student_dataset/articulation/test.jsonl"

lora:
  # Placeholders for the not-yet-implemented trainer -- no PEFT/LoRA code
  # exists yet. Values are conventional defaults for a ~3B model.
  enabled: true
  rank: 16
  alpha: 32          # commonly set to 2x rank
  dropout: 0.05
  target_modules:    # standard attention + MLP projections for Llama's transformer blocks -- same names as Qwen2.5/delivery and (previously) Gemma
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  epochs: 3
  learning_rate: 2.0e-4              # LoRA tolerates a higher LR than full fine-tuning
  # Per-device. effective_batch_size = batch_size * gradient_accumulation_steps * num_gpus.
  # Single GPU: 1 * 16 * 1 = 16. Under `accelerate launch --num_processes=2`
  # this SAME config yields 1 * 16 * 2 = 32 -- DDP doesn't change batch_size,
  # it runs `num_gpus` copies of it in parallel. Halve
  # gradient_accumulation_steps to 8 to hold effective_batch_size at 16 under
  # 2 GPUs instead of doubling it.
  #
  # batch_size MUST stay 1 on a 16GB T4. The logits tensor (see the
  # quantization block above) scales linearly with batch_size: at this
  # model's real max example length (3797 tokens, see max_sequence_length
  # below) that's real per-sample memory that batch_size 2 would double.
  # Kept at the value this project settled on after a real OOM on the
  # original (Gemma) student -- that crash was at Gemma's own 4176-token
  # max under a batch_size=4 config, needing ~25 GB of logits; the fix
  # (batch_size 1, gradient_accumulation_steps 16 instead of 4*4) is
  # preserved unchanged here rather than re-tuned for Llama's smaller
  # vocabulary, since effective_batch_size (and therefore training
  # dynamics) must stay comparable across both students to be comparable.
  batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.01
  # Truncation cap only -- it does NOT drive memory. ConversationDataCollator
  # pads dynamically to each batch's own longest example (and batch_size is
  # 1 here, so there is no cross-example padding at all), so the real cost
  # is the actual token count of each example, not this ceiling -- lowering
  # it would save nothing while removing safety margin for future data.
  #
  # Re-measured with the REAL meta-llama/Llama-3.2-3B-Instruct tokenizer
  # (not carried over from Gemma's numbers) over all 1600 articulation train
  # rows, tokenizing the exact conversations
  # training.trainer.dataset._tokenize_conversation produces: p50=2557,
  # p90=3498, p95=3583, p99=3738, max=3797 -- nothing is truncated at 6144,
  # and nothing would be truncated even at 4096. Left at 6144 rather than
  # tightened: the headroom is free (padding is dynamic, per above) and
  # only matters if the prompt templates or teacher_output schema grow
  # later -- this is the same reasoning the previous (Gemma) value used,
  # re-verified against the new tokenizer rather than assumed to still hold.
  max_sequence_length: 6144

  # GPU memory: recompute activations during backward instead of storing
  # them (~20-30% slower per step, large activation-memory cut). Kept on
  # unchanged from the original (Gemma) student's config, where it was
  # required headroom at that model's larger batch_size/vocabulary combo --
  # without it, that exact combination OOM'd on a single T4 (Colab). See
  # trainer/model_loader.py's attach_lora for the LoRA-specific
  # prerequisite this pairs with.
  gradient_checkpointing: true

  # GPU DataLoader throughput -- see training/trainer/__init__.py's
  # TrainingHyperparams docstring for what each does; benefit here is
  # modest since tokenization already happens eagerly, not per-batch.
  dataloader_num_workers: 2
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2

  # Caps how many eval batches of raw logits Trainer holds in memory
  # before offloading to CPU -- keeps validation from spiking memory on
  # top of training. null = accumulate everything (fine for this dataset's
  # small eval sets; lower this first if evaluation OOMs on a larger one).
  eval_accumulation_steps: null

  # Stop training if validation loss hasn't improved for this many
  # evaluation calls. null disables early stopping entirely.
  early_stopping_patience: 3

checkpointing:
  # Root directory for this run's outputs; the trainer creates
  # {output_dir}/checkpoints, {output_dir}/adapters, and
  # {output_dir}/logs underneath it -- intermediate checkpoints and the
  # final LoRA adapter are always kept separate (see trainer/train.py).
  output_dir: "backend/knowledge_distillation/training/outputs/articulation"
  save_strategy: "epoch"    # "epoch" | "steps"
  save_steps: 500           # only used when save_strategy is "steps"
  logging_steps: 20
  evaluation_strategy: "epoch"  # "epoch" | "steps"
  eval_steps: 500           # only used when evaluation_strategy is "steps"

randomness:
  seed: 42   # matches training/data/split_dataset.py's default seed
